# Compare Parallel vs Standard Mode Configuration
# ================================================
# Runs both standard and parallel paths to compare outputs
#
# RUN WITH 2 GPUs:
#   torchrun --nproc_per_node=2 scripts/compare_parallel.py --config config/compare_parallel.yaml
#
# Expected: SYNC_OK messages (max_diff < 1e-5) at all checkpoints

# Output settings
out_dir: "inference_outputs/compare_parallel"

# Protein design parameters
length: 30
num_designs: 1

# Symmetry: I = Icosahedral (60-fold symmetry)
# This creates 60 * length = 1800 residues total
symmetry: I

# MPNN settings
mpnn_batch_size: 5

# Parallel processing
# The script auto-detects allocated GPUs from CUDA_VISIBLE_DEVICES
# Set attention_parallel_factor to override (e.g., 2 to use only 2 of 4 allocated GPUs)
attention_parallel_factor: 2
low_memory_mode: true  # Use structure local sequence local attention indices
extra_chunking: false  # Further chunking to reduce memory at cost of speed

# Debug verbosity flags (controlled by debug_context.py)
# All default to false for production runs
verbose: false           # Master flag: enables ALL debug logging
verbose_stats: true     # Tensor statistics (.float().mean()/.std() on large tensors - expensive!)
verbose_time: false      # Timing for each pipeline phase
verbose_memory: false     # GPU memory tracking at key stages

# Reproducibility
seed: 42

# Force rerun (ignore cached results)
force_rerun: true

# Weights & Biases logging (disabled for comparison)
wandb:
  enabled: false
  project: "fast-rfd3"
  run_name: null
